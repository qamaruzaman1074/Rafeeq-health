<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative inheritance pattern overview</title>
  <desc id="desc">Three simplified family trees for autosomal recessive, autosomal dominant, and X-linked examples.</desc>
  <rect width="480" height="200" fill="#f5f3ef" rx="12"/>
  <text x="80" y="28" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#134e4a">Recessive</text>
  <circle cx="60" cy="52" r="10" fill="#99f6e4" stroke="#0f766e"/>
  <circle cx="100" cy="52" r="10" fill="#99f6e4" stroke="#0f766e"/>
  <line x1="60" y1="62" x2="80" y2="78" stroke="#0f766e"/>
  <line x1="100" y1="62" x2="80" y2="78" stroke="#0f766e"/>
  <circle cx="80" cy="92" r="10" fill="#fde68a" stroke="#b45309"/>
  <text x="240" y="28" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#134e4a">Dominant</text>
  <circle cx="220" cy="52" r="10" fill="#fde68a" stroke="#b45309"/>
  <circle cx="260" cy="52" r="10" fill="#99f6e4" stroke="#0f766e"/>
  <line x1="220" y1="62" x2="240" y2="78" stroke="#0f766e"/>
  <line x1="260" y1="62" x2="240" y2="78" stroke="#0f766e"/>
  <circle cx="230" cy="92" r="10" fill="#fde68a" stroke="#b45309"/>
  <circle cx="250" cy="92" r="10" fill="#99f6e4" stroke="#0f766e"/>
  <text x="400" y="28" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#134e4a">X-linked</text>
  <circle cx="380" cy="52" r="10" fill="#fde68a" stroke="#b45309"/>
  <circle cx="420" cy="52" r="10" fill="#99f6e4" stroke="#0f766e"/>
  <line x1="380" y1="62" x2="400" y2="78" stroke="#0f766e"/>
  <line x1="420" y1="62" x2="400" y2="78" stroke="#0f766e"/>
  <rect x="388" y="86" width="24" height="14" rx="4" fill="#99f6e4" stroke="#0f766e"/>
  <circle cx="412" cy="93" r="7" fill="#fde68a" stroke="#b45309"/>
</svg>
