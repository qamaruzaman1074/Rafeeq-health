<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Understand your genetic result - in your language, at your pace, with a counsellor one tap away."
    />
    <meta name="theme-color" content="#0B3F45" />
    <meta name="color-scheme" content="light" />
    <title>Rafeeq</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("rafeeq.lang");
          if (stored === "ar" || stored === "en") {
            document.documentElement.lang = stored;
            document.documentElement.dir = stored === "ar" ? "rtl" : "ltr";
          }
        } catch (error) {
          /* Storage can be unavailable before the app boots. */
        }
      })();
    </script>
    <!-- rafeeq-font-preload -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
