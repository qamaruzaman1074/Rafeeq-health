<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-labelledby="title">
  <title id="title">Carrier status illustration</title>
  <rect width="400" height="240" fill="#f5f3ef" rx="16"/>
  <rect x="32" y="48" width="336" height="120" rx="12" fill="#fff" stroke="#0d9488" stroke-width="2"/>
  <text x="200" y="36" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#134e4a">One variant copy (illustrative)</text>
  <circle cx="120" cy="108" r="28" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <circle cx="200" cy="108" r="28" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <circle cx="280" cy="108" r="28" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <text x="120" y="113" text-anchor="middle" font-size="11" fill="#134e4a">Normal</text>
  <text x="200" y="113" text-anchor="middle" font-size="11" fill="#134e4a">Normal</text>
  <text x="280" y="113" text-anchor="middle" font-size="11" fill="#78350f">Variant</text>
  <text x="200" y="200" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#4b5563">Carrier: may pass variant on; not necessarily ill</text>
</svg>
