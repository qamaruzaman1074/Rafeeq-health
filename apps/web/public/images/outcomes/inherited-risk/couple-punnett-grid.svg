<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative outcomes when both parents are carriers</title>
  <desc id="desc">Educational Punnett-style grid for autosomal recessive inheritance. Not personal risk.</desc>
  <rect width="480" height="360" fill="#f8f6f0" rx="16"/>
  <text x="240" y="40" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#134e4a">Educational example — not your personal risk</text>
  <circle cx="120" cy="88" r="22" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="120" y="93" text-anchor="middle" font-size="11" font-weight="600" fill="#134e4a">Parent A</text>
  <circle cx="360" cy="88" r="22" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="360" y="93" text-anchor="middle" font-size="11" font-weight="600" fill="#134e4a">Parent B</text>
  <line x1="142" y1="88" x2="218" y2="130" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="358" y1="88" x2="282" y2="130" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="56" y="130" width="172" height="88" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="142" y="168" text-anchor="middle" font-size="13" font-weight="600" fill="#134e4a">Neither variant</text>
  <text x="142" y="188" text-anchor="middle" font-size="11" fill="#4b5563">Illustrative outcome</text>
  <rect x="252" y="130" width="172" height="88" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="338" y="168" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">One variant</text>
  <text x="338" y="188" text-anchor="middle" font-size="11" fill="#4b5563">Carrier (example)</text>
  <rect x="56" y="238" width="172" height="88" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="142" y="276" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">One variant</text>
  <text x="142" y="296" text-anchor="middle" font-size="11" fill="#4b5563">Carrier (example)</text>
  <rect x="252" y="238" width="172" height="88" rx="10" fill="#134e4a" stroke="#0f3d3d" stroke-width="2"/>
  <text x="338" y="276" text-anchor="middle" font-size="13" font-weight="600" fill="#f8f6f0">Two variants</text>
  <text x="338" y="296" text-anchor="middle" font-size="11" fill="#d1fae5">Discuss with a professional</text>
  <text x="240" y="340" text-anchor="middle" font-size="11" fill="#6b7280">Each square is one equally likely illustrative outcome for one pregnancy.</text>
</svg>
