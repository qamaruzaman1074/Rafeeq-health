<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative autosomal recessive pregnancy outcomes</title>
  <desc id="desc">Four equally likely illustrative outcomes when both parents are carriers: twenty-five percent affected, fifty percent carrier, twenty-five percent neither.</desc>
  <rect width="360" height="200" fill="#f5f3ef" rx="12"/>
  <rect x="24" y="48" width="150" height="64" rx="8" fill="#ecfdf5" stroke="#0f766e"/>
  <text x="99" y="76" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#134e4a">25%</text>
  <text x="99" y="96" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#4b5563">affected (example)</text>
  <rect x="186" y="48" width="150" height="64" rx="8" fill="#fffbeb" stroke="#b45309"/>
  <text x="261" y="76" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#92400e">50%</text>
  <text x="261" y="96" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#4b5563">carrier (example)</text>
  <rect x="105" y="128" width="150" height="64" rx="8" fill="#f0fdfa" stroke="#0d9488"/>
  <text x="180" y="156" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#0f766e">25%</text>
  <text x="180" y="176" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#4b5563">neither variant</text>
</svg>
